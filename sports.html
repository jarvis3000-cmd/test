<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud TV</title>

<link rel="icon" href="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

<style>
:root {
  --bg:#050509;
  --card:#0b0b12;
  --border:rgba(255,255,255,.08);
  --radius:18px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:#fff;}

header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:#07070c;border-bottom:1px solid var(--border);
}
header img{height:38px;}
header span{font-size:20px;font-weight:700;}
#searchBar{
  margin-left:auto;
  padding:7px 12px;
  border-radius:20px;
  border:none;
  outline:none;
  font-size:14px;
  background:#222;color:white;
}
#searchBar:focus{background:#333;box-shadow:0 0 8px #00ffcc;}

#categories{text-align:center;margin:12px 0;}
#categories button{
  background:linear-gradient(145deg,#ffeb3b,#fdd835);
  border:none;padding:8px 18px;margin:6px;font-weight:600;border-radius:20px;cursor:pointer;
}
#categories button.active{background:#00ffcc;color:#000;}

.grid{display:grid;gap:14px;}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:601px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.card{
  background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);
  cursor:pointer;transition:0.2s;
}
.card:hover{transform:scale(1.05);}
.card img{width:100%;height:120px;object-fit:contain;background:#000;}
.card h3{text-align:center;padding:8px;font-size:14px;font-weight:600;}

#playerModal{
  display:none;
  position:fixed;inset:0;background:rgba(0,0,0,0.95);
  z-index:9999;flex-direction:column;justify-content:center;align-items:center;
}
#closeBtn{
  position:absolute;top:10px;right:10px;background:#000;color:#fff;border:none;font-size:22px;cursor:pointer;
}
video{
  width:90%;max-width:1100px;height:70vh;background:black;border-radius:12px;
}
#controls{
  display:flex;justify-content:center;align-items:center;gap:10px;
  margin-top:8px;background:#111;padding:8px 10px;border-radius:12px;
}
.btn{
  background:#111;color:#fff;border:1px solid var(--border);
  padding:8px 12px;border-radius:10px;cursor:pointer;font-size:14px;
}
.btn:hover{background:#00ffcc;color:#000;}
</style>
</head>
<body>

<header>
  <img src="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png">
  <span>Cloud TV</span>
  <input type="text" id="searchBar" placeholder="Search channels...">
</header>

<div id="categories"></div>
<div id="channels" class="grid"></div>

<div id="playerModal">
  <button id="closeBtn" onclick="closePlayer()">✖</button>
  <video id="videoPlayer" autoplay></video>

  <div id="controls">
    <button id="prevBtn" class="btn">Prev</button>
    <button id="playPauseBtn" class="btn"><i class="fas fa-play" id="playIcon"></i></button>
    <button id="nextBtn" class="btn">Next</button>
    <button id="fullscreenBtn" class="btn">Fullscreen</button>
    <button id="muteBtn" class="btn"><i class="fas fa-volume-up" id="muteIcon"></i></button>
    <button id="closeCtrlBtn" class="btn">Close</button>
  </div>
</div>

<script>
let channels=[],filtered=[],currentGroup="All",currentIndex=0,player=null;
const video=document.getElementById("videoPlayer");

window.addEventListener("load",()=>{
  document.getElementById("playerModal").style.display="none";
});

async function loadChannels(){
  const res=await fetch("https://raw.githubusercontent.com/Shubhamkur/json/refs/heads/main/jspo?t="+Date.now());
  channels=await res.json();
  filtered=channels;
  renderCategories();
  renderChannels();
}

function renderCategories(){
  const groups=["All",...new Set(channels.map(c=>c.group||"Other"))];
  const c=document.getElementById("categories");
  c.innerHTML="";
  groups.forEach(g=>{
    const b=document.createElement("button");
    b.textContent=g;
    if(g===currentGroup) b.classList.add("active");
    b.onclick=()=>{currentGroup=g;filterChannels();};
    c.appendChild(b);
  });
}

function filterChannels(){
  const s=document.getElementById("searchBar").value.toLowerCase();
  filtered=channels.filter(c=>
    (currentGroup==="All"||(c.group||"Other")===currentGroup)
    && c.name.toLowerCase().includes(s)
  );
  renderChannels();
  renderCategories();
}

function renderChannels(){
  const g=document.getElementById("channels");
  g.innerHTML="";
  filtered.forEach((ch,i)=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`<img src="${ch.logo}"><h3>${ch.name}</h3>`;
    card.onclick=()=>openPlayer(i);
    g.appendChild(card);
  });
}

async function openPlayer(index){
  currentIndex=index;
  const ch=filtered[index];
  document.getElementById("playerModal").style.display="flex";

  if(player){await player.destroy();player=null;}
  video.src="";

  if(ch.url1 && ch.keyId && ch.key){
    player=new shaka.Player(video);
    player.configure({
      drm:{clearKeys:{[ch.keyId]:ch.key}}
    });
    try{
      await player.load(ch.url1);
      video.play();
    }catch(e){
      alert("Stream failed");
    }
  }else if(ch.link){
    video.src=ch.link;
    video.play();
  }
}

function closePlayer(){
  video.pause();
  video.src="";
  if(player){player.destroy();player=null;}
  document.getElementById("playerModal").style.display="none";
}

document.getElementById("playPauseBtn").onclick=()=>{
  const icon=document.getElementById("playIcon");
  if(video.paused){video.play();icon.className="fas fa-pause";}
  else{video.pause();icon.className="fas fa-play";}
};
document.getElementById("muteBtn").onclick=()=>{
  const icon=document.getElementById("muteIcon");
  video.muted=!video.muted;
  icon.className=video.muted?"fas fa-volume-mute":"fas fa-volume-up";
};
document.getElementById("fullscreenBtn").onclick=()=>{
  if(video.requestFullscreen) video.requestFullscreen();
};
document.getElementById("prevBtn").onclick=()=>{
  if(currentIndex>0) openPlayer(currentIndex-1);
};
document.getElementById("nextBtn").onclick=()=>{
  if(currentIndex<filtered.length-1) openPlayer(currentIndex+1);
};
document.getElementById("closeCtrlBtn").onclick=()=>closePlayer();
document.getElementById("searchBar").addEventListener("input",filterChannels);

loadChannels();
</script>
</body>
</html>
